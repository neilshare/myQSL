name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:openapi
      - run: pnpm generate:api
      - run: git diff --exit-code -- openapi/myQSL-v1.yaml apps/web/src/lib/api-types.ts
      - run: pnpm verify:production --dry-run
      - run: pnpm db:migrate:local
      - run: pnpm run check
      - run: pnpm check:bundle
      - run: pnpm check:placeholders
      - run: pnpm exec playwright install --with-deps chromium
      - run: CI=1 pnpm test:e2e
