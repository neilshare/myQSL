name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:openapi
      - run: pnpm generate:api
      - run: git diff --exit-code -- openapi/myQSL-v1.yaml apps/web/src/lib/api-types.ts
      - run: pnpm verify:production --dry-run
      - run: pnpm db:migrate:local
      - run: pnpm run check
      - run: pnpm check:bundle
      - run: pnpm check:placeholders
      - run: pnpm exec playwright install --with-deps chromium
      - run: CI=1 pnpm test:e2e
